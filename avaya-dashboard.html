<title>مركز تقارير أفايا</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: a control-room console. Sticky header + two views (collect reports / dashboard). Collect = active request card beside a checklist; dashboard = summary band, KPI tiles, charts, scorecards. */
:root{
  /* single committed look: dark "network operations center" console */
  --bg:#050A15; --surface:rgba(13,23,42,.78); --surface-2:rgba(24,40,66,.55); --line:rgba(96,165,250,.16); --ink:#E3EEFF; --muted:#7F95B3;
  --accent:#22D3EE; --accent-ink:#021219; --accent-soft:rgba(34,211,238,.12); --signal:#A78BFA; --signal-soft:rgba(167,139,250,.14);
  --good:#34D399; --good-soft:rgba(52,211,153,.14); --warn:#FBBF24; --warn-soft:rgba(251,191,36,.13); --bad:#F87171; --bad-soft:rgba(248,113,113,.14);
  --c1:#22D3EE; --c2:#A78BFA; --c3:#60A5FA; --c4:#F87171; --c5:#64748B;
  --glow:0 0 0 1px rgba(34,211,238,.06),0 10px 40px rgba(0,0,0,.45);
  --shadow:var(--glow);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-data:"JetBrains Mono","IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; color-scheme:dark;
}
body{background:var(--bg) radial-gradient(1200px 600px at 85% -10%,rgba(34,211,238,.10),transparent 60%) no-repeat,var(--bg);background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.3}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
.mark svg{width:22px;height:22px}
.brand h1{font-size:18px}
.brand small{display:block;color:var(--muted);font-size:12px;font-family:var(--f-body)}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:4px}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab .step{font-family:var(--f-data);font-size:11px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink)}
.tab[aria-selected="true"] .step{background:var(--accent);color:var(--accent-ink)}

main{padding-block:24px 64px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:transform .1s,background .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.signal{background:var(--signal);border-color:var(--signal);color:#1E1404}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.label{font-size:12px;letter-spacing:.02em;color:var(--muted);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.sig{background:var(--signal-soft);color:var(--signal);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* collect view */
.collect{display:grid;gap:16px;max-width:820px;margin:0 auto}
#view-collect .analyze-bar,#view-collect #reset-confirm{max-width:820px;margin-inline:auto}
.steps{display:flex;gap:5px;flex-wrap:wrap}
.steps i{width:22px;height:6px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line)}
.steps i.done{background:var(--good);border-color:var(--good);box-shadow:0 0 8px var(--good)}
.steps i.cur{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px var(--accent);animation:blink 1.4s infinite}
.steps i.skip{background:transparent;border-style:dashed}
.counter{font-family:var(--f-body);font-weight:700;font-size:14px;color:var(--accent)}
[hidden]{display:none!important}
.rep-name{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:16px 18px;border-radius:12px;background:rgba(2,10,20,.7);border:1px solid rgba(34,211,238,.35);box-shadow:inset 0 0 24px rgba(34,211,238,.08)}
.rep-name code{font-family:var(--f-data);font-size:clamp(15px,2.4vw,20px);font-weight:700;color:var(--accent);direction:ltr;word-break:break-all;text-shadow:0 0 12px rgba(34,211,238,.4)}
.got{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--good-soft);color:var(--good);font-size:14px;font-weight:600;flex-wrap:wrap}
.got .link{background:none;border:0;color:var(--ink);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
details.all{padding:6px 8px}
details.all>summary{cursor:pointer;padding:10px 12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;list-style:none}
details.all>summary::-webkit-details-marker{display:none}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.req{padding:24px;display:grid;gap:18px}
.req-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.req h2{font-size:24px}
.req .en{font-family:var(--f-data);font-size:13px;color:var(--muted);direction:ltr;text-align:right}
.path{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;direction:ltr;justify-content:flex-end}
.path span{background:var(--surface-2);border:1px solid var(--line);padding:2px 8px;border-radius:6px;font-family:var(--f-data);font-size:12px}
.path i{color:var(--muted);font-style:normal}
.why{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--muted)}
.why b{color:var(--ink)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;display:grid;gap:8px;justify-items:center}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:40px;height:40px;color:var(--accent)}
.drop strong{font-size:16px}
.drop small{color:var(--muted)}
.req-actions{display:flex;gap:8px;flex-wrap:wrap}
.reading{display:flex;gap:14px;align-items:center;padding:14px;border-radius:10px;background:var(--accent-soft)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:64px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--accent);border-top-color:transparent;animation:sp 0.9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.result{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;background:var(--surface-2)}
.result .rname{font-weight:700;font-size:16px}
.mini-metrics{display:flex;flex-wrap:wrap;gap:6px}
.mini-metrics span{font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px}

.list{padding:8px}
.list-head{padding:12px 12px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.list-head h3{font-size:16px}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:0 12px 10px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:9px;cursor:pointer;border:1px solid transparent;width:100%;background:transparent;text-align:right}
.item:hover{background:var(--surface-2)}
.item.current{border-color:var(--accent);background:var(--accent-soft)}
.item .st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-size:12px}
.item.done .st{background:var(--good);border-color:var(--good);color:#fff}
.item.skipped .st{border-style:dashed}
.item .t,.item .s{display:block}
.item .t{font-weight:600;font-size:14px;line-height:1.35}
.item .s{font-size:12px;color:var(--muted);font-family:var(--f-data);direction:ltr;text-align:right}
.analyze-bar{margin-top:20px;padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.analyze-bar p{margin:0;color:var(--muted);font-size:14px}
.analyze-bar strong{color:var(--ink)}
.notice{padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.notice.err{background:var(--bad-soft);color:var(--bad)}

/* dashboard */
.dash{display:grid;gap:20px}
.example{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--signal-soft);color:var(--signal);font-weight:600;font-size:14px}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;align-items:center;padding:22px 24px}
@media (max-width:760px){.hero{grid-template-columns:1fr;justify-items:start}}
.ring{position:relative;width:118px;height:118px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .val b{font-family:var(--f-data);font-size:30px;line-height:1}
.ring .val small{font-size:11px;color:var(--muted);display:block}
.hero h2{font-size:22px;margin-bottom:6px}
.hero p{margin:0;color:var(--muted);max-width:70ch}
.hero .meta{display:grid;gap:8px;justify-items:end}
@media (max-width:760px){.hero .meta{justify-items:start}}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.kpi{padding:16px;display:grid;gap:6px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--line)}
.kpi.good::before{background:var(--good)} .kpi.warn::before{background:var(--warn)} .kpi.bad::before{background:var(--bad)}
.kpi .k-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.kpi .v{font-family:var(--f-data);font-size:28px;font-weight:600;line-height:1.1;direction:ltr;text-align:right}
.kpi .tg{font-size:12px;color:var(--muted)}
.kpi .src{font-size:11px;color:var(--muted);font-family:var(--f-data);direction:ltr;text-align:right;opacity:.85}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.grid2b{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:900px){.grid2,.grid2b{grid-template-columns:1fr}}
.card{padding:18px 20px;display:grid;gap:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card-h h3{font-size:16px}
.chart-box{position:relative;height:280px}
.chart-box.sm{height:240px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--f-data);font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.bar{display:flex;align-items:center;gap:8px;min-width:120px}
.bar i{display:block;height:6px;border-radius:9px;background:var(--accent)}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)} .bar i.good{background:var(--good)}
.ins{display:grid;gap:10px}
.ins-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px;border-radius:10px;background:var(--surface-2)}
.ins-item .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700}
.ins-item.strength .ic{background:var(--good-soft);color:var(--good)}
.ins-item.risk .ic{background:var(--bad-soft);color:var(--bad)}
.ins-item.opportunity .ic{background:var(--signal-soft);color:var(--signal)}
.ins-item b{display:block;margin-bottom:2px}
.ins-item p{margin:0;color:var(--muted);font-size:14px}
.rec{display:grid;gap:10px}
.rec-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.rec-item:last-child{border-bottom:0}
.rec-item p{margin:2px 0 0;color:var(--muted);font-size:14px}
.gaps{display:flex;flex-wrap:wrap;gap:6px}
.ask{display:grid;gap:10px}
.ask-row{display:flex;gap:8px;flex-wrap:wrap}
.ask-row input{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--surface-2);padding:10px 12px;border-radius:9px}
.answer{white-space:pre-wrap;background:var(--surface-2);border-radius:10px;padding:14px;font-size:14.5px;min-height:20px}
.sugs{display:flex;gap:6px;flex-wrap:wrap}
.sugs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.sugs button:hover{border-color:var(--accent);color:var(--accent)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:20;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.analyzing{padding:40px 24px;display:grid;gap:14px;justify-items:center;text-align:center}
.analyzing .spin{width:42px;height:42px;border-width:4px}
.analyzing p{color:var(--muted);margin:0}

/* ---- tech layer ---- */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.gridbg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 75%);opacity:.5;animation:gridmove 18s linear infinite}
@keyframes gridmove{to{background-position:0 44px,44px 0}}
.app{position:relative;z-index:1}
.top{background:rgba(5,10,21,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body::before{background:rgba(5,10,21,.9)}
.panel{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:relative;transition:border-color .25s,box-shadow .25s}
.panel:hover{border-color:rgba(34,211,238,.32)}
.mark{box-shadow:0 0 18px rgba(34,211,238,.55);animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 30px rgba(34,211,238,.85)}}
.live{display:inline-flex;gap:6px;align-items:center;font-family:var(--f-data);font-size:11px;color:var(--good);letter-spacing:.08em}
.live i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);animation:blink 1.4s infinite}
.live.off{color:var(--muted)} .live.off i{background:var(--muted);box-shadow:none;animation:none}
@keyframes blink{50%{opacity:.25}}
.hero h2,.req h2{background:linear-gradient(90deg,var(--ink),var(--accent) 60%,var(--signal));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi .v{text-shadow:0 0 18px rgba(34,211,238,.25)}
.kpi:hover{transform:translateY(-2px)}
.kpi{transition:transform .2s,border-color .25s}
.btn.primary{box-shadow:0 0 20px rgba(34,211,238,.35)}
.btn.primary:hover{box-shadow:0 0 28px rgba(34,211,238,.6)}
.drop{position:relative;overflow:hidden;border-color:rgba(34,211,238,.3)}
.drop::after{content:"";position:absolute;inset-inline:0;top:-40%;height:40%;background:linear-gradient(180deg,transparent,rgba(34,211,238,.10),transparent);animation:scan 3.2s linear infinite;pointer-events:none}
@keyframes scan{to{top:110%}}
.reading{position:relative;overflow:hidden}
.reading::after{content:"";position:absolute;inset-block:0;width:30%;background:linear-gradient(90deg,transparent,rgba(34,211,238,.18),transparent);animation:sweep 1.6s linear infinite}
@keyframes sweep{from{inset-inline-start:-30%}to{inset-inline-start:100%}}
.files{display:flex;gap:8px;flex-wrap:wrap}
.files span{font-family:var(--f-data);font-size:12px;padding:4px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);direction:ltr}
.files span b{color:var(--accent)}
.dash>*,.collect>*,.analyze-bar{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.dash>*:nth-child(2){animation-delay:.06s}.dash>*:nth-child(3){animation-delay:.12s}.dash>*:nth-child(4){animation-delay:.18s}.dash>*:nth-child(5){animation-delay:.24s}.dash>*:nth-child(n+6){animation-delay:.3s}
@keyframes rise{from{opacity:.3;transform:translateY(10px)}}
.ring circle:last-child{transition:stroke-dashoffset 1.4s cubic-bezier(.2,.7,.2,1);filter:drop-shadow(0 0 6px currentColor)}
.bar i{box-shadow:0 0 8px currentColor;transition:width 1s}
.item.current{box-shadow:inset 0 0 0 1px var(--accent),0 0 18px rgba(34,211,238,.15)}
.progress i{background:linear-gradient(90deg,var(--accent),var(--signal));box-shadow:0 0 10px var(--accent)}
.export{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.export ol{margin:0;padding-inline-start:20px}
.export code{font-family:var(--f-data);font-size:12px;background:var(--surface-2);padding:1px 6px;border-radius:5px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.gridbg{animation:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


.mtiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:700px){.mtiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);display:grid;gap:6px}
.mt-h{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px}
.mch{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.mch bdi{font-family:var(--f-data)}
.mch.up{color:var(--good)}.mch.down{color:var(--bad)}
.mbars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;height:120px;align-items:end}
.mb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;min-width:0}
.mb i{display:block;width:70%;border-radius:5px 5px 2px 2px;background:var(--c5);opacity:.7}
.mb.cur i{background:linear-gradient(180deg,var(--accent),var(--signal));opacity:1;box-shadow:0 0 12px rgba(34,211,238,.35)}
.mv{font-family:var(--f-data);font-size:11.5px;font-weight:700;direction:ltr}
.ml{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mtg{font-size:11px;color:var(--muted)}
.rpt .mtiles{grid-template-columns:repeat(3,1fr)}
.rpt .mt{background:var(--rp-soft);border-color:var(--rp-line)}
.rpt .mb i{background:#CBD5E1;opacity:1}.rpt .mb.cur i{background:var(--rp-accent);box-shadow:none}
.rpt .ml,.rpt .mtg{color:var(--rp-muted)}.rpt .mch{color:var(--rp-muted)}.rpt .mch.up{color:var(--rp-good)}.rpt .mch.down{color:var(--rp-bad)}
/* ---- export + printable report (light A4 document, rendered off-screen) ---- */
:root{--rp-bg:#FFFFFF;--rp-ink:#13203A;--rp-muted:#5D6C82;--rp-line:#DCE3EC;--rp-soft:#F3F6FA;--rp-navy:#0A1630;--rp-accent:#0891B2;--rp-violet:#7C3AED;--rp-good:#15803D;--rp-warn:#B45309;--rp-bad:#B91C1C}
.exportp .req-actions{gap:10px}
.exportp .ex-note{font-size:13px;color:var(--muted);margin:0}
.rpt{position:fixed;left:-12000px;top:0;width:794px;background:var(--rp-bg);color:var(--rp-ink);font-family:var(--f-body);font-size:12.5px;line-height:1.6}
.rpt .pg{width:794px;min-height:1123px;padding:0 0 30px;background:var(--rp-bg);position:relative;display:flex;flex-direction:column}
.rpt .in{padding:28px 46px 0;display:grid;gap:18px;flex:1;align-content:start}
.rpt .band{background:linear-gradient(120deg,var(--rp-navy),#0F2A4F 70%,#123C63);color:#fff;padding:26px 46px 22px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:4px solid var(--rp-accent)}
.rpt .band.sm{padding:16px 46px 14px}
.rpt .band h1{font-family:var(--f-display);font-size:26px;margin:0;line-height:1.3}
.rpt .band.sm h1{font-size:18px}
.rpt .band .sub{font-size:12px;color:#9FD8E8}
.rpt .band .meta{text-align:left;font-size:11.5px;color:#C9D6E8;direction:ltr;font-family:var(--f-data)}
.rpt h2{font-family:var(--f-display);font-size:16px;margin:0;color:var(--rp-navy);display:flex;align-items:center;gap:8px}
.rpt h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--rp-accent)}
.rpt .exec{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:center;background:var(--rp-soft);border:1px solid var(--rp-line);border-radius:10px;padding:18px}
.rpt .score{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;text-align:center;border:10px solid var(--rp-line)}
.rpt .score b{font-family:var(--f-data);font-size:40px;line-height:1;display:block}
.rpt .score small{font-size:11px;color:var(--rp-muted)}
.rpt .exec h3{font-family:var(--f-display);font-size:17px;margin:0 0 6px;line-height:1.45}
.rpt .exec p{margin:0;color:var(--rp-muted)}
.rpt .kg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rpt .k{border:1px solid var(--rp-line);border-radius:8px;padding:10px 12px;border-inline-start:4px solid var(--rp-line)}
.rpt .k.good{border-inline-start-color:var(--rp-good)}.rpt .k.warn{border-inline-start-color:var(--rp-warn)}.rpt .k.bad{border-inline-start-color:var(--rp-bad)}
.rpt .k .l{font-size:11px;color:var(--rp-muted);font-weight:600}
.rpt .k .v{font-family:var(--f-data);font-size:21px;font-weight:700;direction:ltr;text-align:right}
.rpt .k .t{font-size:10.5px;color:var(--rp-muted)}
.rpt .vol{display:flex;gap:10px}
.rpt .vol div{flex:1;border-radius:8px;padding:10px 12px;background:var(--rp-soft);border:1px solid var(--rp-line)}
.rpt .vol b{font-family:var(--f-data);font-size:18px;display:block;direction:ltr;text-align:right}
.rpt table{width:100%;border-collapse:collapse;font-size:11.5px}
.rpt th{background:var(--rp-navy);color:#fff;font-weight:600;padding:7px 8px;text-align:right;white-space:nowrap}
.rpt td{padding:6px 8px;border-bottom:1px solid var(--rp-line);white-space:nowrap}
.rpt tr:nth-child(even) td{background:var(--rp-soft)}
.rpt td.n{font-family:var(--f-data);direction:ltr;text-align:right}
.rpt .st{display:inline-block;padding:1px 8px;border-radius:99px;font-size:10.5px;font-weight:700}
.rpt .st.good{background:#DCFCE7;color:var(--rp-good)}.rpt .st.warn{background:#FEF3C7;color:var(--rp-warn)}.rpt .st.bad{background:#FEE2E2;color:var(--rp-bad)}.rpt .st.na{background:var(--rp-soft);color:var(--rp-muted)}
.rpt .cbox{border:1px solid var(--rp-line);border-radius:10px;padding:12px}
.rpt .cbox .ct{font-weight:700;font-size:12.5px;margin-bottom:6px}
.rpt .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rpt .hb{display:grid;grid-template-columns:120px 1fr 52px;gap:8px;align-items:center;font-size:11.5px;margin-bottom:6px}
.rpt .hb i{display:block;height:9px;border-radius:5px;background:var(--rp-violet)}
.rpt .hb span:last-child{font-family:var(--f-data);direction:ltr;text-align:right}
.rpt .ins{display:grid;gap:8px}
.rpt .ins div{border:1px solid var(--rp-line);border-radius:8px;padding:9px 12px;border-inline-start:4px solid var(--rp-accent)}
.rpt .ins div.risk{border-inline-start-color:var(--rp-bad)}.rpt .ins div.strength{border-inline-start-color:var(--rp-good)}.rpt .ins div.opportunity{border-inline-start-color:var(--rp-violet)}
.rpt .ins b{display:block}
.rpt .ins p{margin:0;color:var(--rp-muted)}
.rpt .foot{position:absolute;bottom:12px;left:46px;right:46px;display:flex;justify-content:space-between;font-size:10px;color:var(--rp-muted);border-top:1px solid var(--rp-line);padding-top:6px}
.rpt .wm{position:absolute;top:420px;left:0;right:0;text-align:center;font-family:var(--f-display);font-size:90px;color:rgba(185,28,28,.07);transform:rotate(-18deg);pointer-events:none}
.rpt .small{font-size:11px;color:var(--rp-muted)}
</style>

<canvas id="bg" aria-hidden="true"></canvas><div class="gridbg" aria-hidden="true"></div>
<div class="app" dir="rtl" lang="ar">
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round"><path d="M4 18V11"/><path d="M9 18V6"/><path d="M14 18v-9"/><path d="M19 18V4"/></svg></div>
      <div><h1>مركز تقارير أفايا</h1><small>تحليل تقارير Avaya CMS بالذكاء الاصطناعي · ملفات Excel</small></div>
    </div>
    <span class="live off" id="live"><i></i>OFFLINE</span>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-collect" aria-selected="true"><span class="step">1</span>جمع التقارير</button>
      <button class="tab" role="tab" id="tab-dash" aria-selected="false"><span class="step">2</span>الداش بورد</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="view-collect">
    <div class="collect">
      <div class="panel req" id="req"></div>
      <details class="panel list all" id="all-list">
        <summary><span>كل التقارير (اضغط للعرض أو للرجوع لتقرير معيّن)</span><span class="chip" id="count-chip"></span></summary>
        <div class="progress"><i id="prog" style="width:0"></i></div>
        <div id="items"></div>
      </details>
    </div>
    <div class="panel analyze-bar">
      <p id="analyze-text"></p>
      <div class="req-actions">
        <button class="btn" id="btn-reset">مسح كل التقارير</button>
        <button class="btn primary" id="btn-analyze">بدء التحليل</button>
      </div>
    </div>
    <div id="reset-confirm" class="panel analyze-bar" hidden>
      <p><strong>متأكد؟</strong> سيتم حذف كل التقارير المرفقة ونتيجة التحليل.</p>
      <div class="req-actions"><button class="btn" id="reset-no">إلغاء</button><button class="btn" id="reset-yes" style="color:var(--bad)">نعم، امسح الكل</button></div>
    </div>
  </section>

  <section id="view-dash" hidden>
    <div class="dash" id="dash"></div>
  </section>
</main>
<input type="file" id="file" accept=".xlsx,.xls,.xlsm,.csv,.txt,.tsv" multiple hidden>
<div class="toast" id="toast" hidden></div>
</div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum=v=>typeof v==="number"&&isFinite(v);
const fmtN=v=>isNum(v)?v.toLocaleString("en-US",{maximumFractionDigits:1}):"—";
const fmtSec=s=>{if(!isNum(s))return"—";s=Math.round(s);const m=Math.floor(s/60),r=s%60;return m+":"+String(r).padStart(2,"0")};
const fmtPct=v=>isNum(v)?(Math.round(v*10)/10)+"%":"—";

/* Avaya CMS report checklist, in the order we ask for them */
const BASE_TYPES=[
 {id:"skill_monthly_bymonth",months:3,ar:"أداء المهارات الشهري (MPR)",en:"CrysKSA_Skill_Monthly_ByMonth_Less X sec",tip:"اختر آخر 3 إلى 6 أشهر لنقارن الشهر بما قبله",why:"أساس تقرير MPR الشهري: المكالمات، مستوى الخدمة SLA، الإغلاق، ASA و AHT لكل شهر.",req:true},
 {id:"skill_monthly_byskill",months:2,ar:"الشهر حسب كل مهارة",en:"CrysKSA_Skill_Monthly_BySkill_Less X sec",tip:"الشهر الحالي أو الشهر الماضي كاملاً",why:"يقارن المهارات (الطوابير) ببعض خلال الشهر ويكشف أضعفها.",req:true},
 {id:"skill_daily_byday",ar:"الأداء اليومي",en:"CrysKSA_Skill_Daily_ByDay_Less X sec",tip:"كل أيام الشهر من 1 إلى آخر يوم",why:"اتجاه مستوى الخدمة والإغلاق يوماً بيوم، والأيام السيئة.",req:true},
 {id:"skill_interval",ar:"الأداء حسب الساعة",en:"CrysKSA_Skill_Interval_Less X sec",tip:"يوم واحد مزدحم أو أسبوع",why:"يحدد ساعات الذروة وأين ينهار مستوى الخدمة لتعديل الجدولة.",req:true},
 {id:"agtgrp_monthly_occ",months:2,ar:"الموظفون: الإشغال الشهري",en:"CrysKSA_AgtGrp_Monthly_Occupancy",tip:"نفس شهر تقرير MPR",why:"أداء كل موظف خلال الشهر: الإشغال Occupancy، وقت المكالمات، ACW، وقت الدخول.",req:true},
 {id:"agtgrp_daily_ans",ar:"الموظفون: المكالمات المجابة",en:"CrysKSA_AgtGrp_Daily_AnsCalls",tip:"الشهر كاملاً",why:"عدد المكالمات التي رد عليها كل موظف وزمن المعالجة AHT، لترتيب الموظفين.",req:true},
 {id:"agent_aux",ar:"أكواد الراحة AUX",en:"CrysKSA_Agent AUX Interval",tip:"الشهر أو الأسبوع",why:"وقت الراحات والاجتماعات وأسباب AUX لكل موظف، وكم يأخذ من وقت الإنتاج.",req:true},
 {id:"calling_party",ar:"أرقام المتصلين (لحساب FCR)",en:"CrysKSA_CallingParty_1.1",tip:"أسبوع أو شهر",why:"المتصلون المتكررون من نفس الرقم. منه نحسب تقريباً نسبة الحل من أول اتصال FCR.",req:true},
 {id:"skill_daily_byskill",ar:"اليومي حسب كل مهارة",en:"CrysKSA_Skill_Daily_BySkill_Less X sec",tip:"الشهر كاملاً",why:"تفصيل يومي لكل مهارة.",req:false},
 {id:"skill_interval_byskill",ar:"الساعات حسب كل مهارة",en:"CrysKSA_Skill_Interval_BySkill_Less X sec",tip:"يوم مزدحم",why:"ذروة كل مهارة على حدة.",req:false},
 {id:"agtgrp_daily_occ",ar:"الموظفون: الإشغال اليومي",en:"CrysKSA_AgtGrp_Daily_Occupancy (_New / _HC)",tip:"الشهر كاملاً",why:"الإشغال يوماً بيوم وعدد الموظفين HC.",req:false},
 {id:"agtgrp_interval_occ",ar:"الموظفون: الإشغال حسب الساعة",en:"CrysKSA_AgtGrp_Interval_Occupancy",tip:"نفس يوم تقرير الساعات",why:"هل عدد الموظفين يغطي الذروة؟",req:false},
 {id:"attendance",ar:"الحضور والالتزام",en:"CrysKSA_Attendance_Daily_Agent Based",tip:"الشهر كاملاً",why:"التأخير والغياب والالتزام بالجدول Adherence.",req:false},
 {id:"login_logout",ar:"الدخول والخروج",en:"Login/Logout (Skill)",tip:"أسبوع",why:"أوقات تسجيل الدخول والخروج الفعلية.",req:false}
];
const AR_M=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const EN_M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const SLOT_NAMES=["الشهر الحالي","الشهر الماضي","قبل شهرين"];
function monthAt(off){
  const now=new Date(),d=new Date(now.getFullYear(),now.getMonth()-off,1);
  const last=off===0?now:new Date(d.getFullYear(),d.getMonth()+1,0);
  const f=x=>String(x.getDate()).padStart(2,"0")+"/"+String(x.getMonth()+1).padStart(2,"0")+"/"+x.getFullYear();
  return {ar:AR_M[d.getMonth()]+" "+d.getFullYear(),en:EN_M[d.getMonth()]+" "+d.getFullYear(),range:f(d)+" – "+f(last)};
}
const TYPES=[];
BASE_TYPES.forEach(b=>{
  if(b.months){for(let i=0;i<b.months;i++){const m=monthAt(i);TYPES.push({...b,id:b.id+"@m"+i,base:b.id,slot:i,month:m,ar:b.ar+" · "+SLOT_NAMES[i]+" ("+m.ar+")",tip:m.range+(i===0?" (من أول الشهر حتى اليوم)":"")})}}
  else TYPES.push({...b,base:b.id});
});
const baseOf=id=>String(id||"").split("@")[0];
const OTHER={id:"other",ar:"تقرير آخر",en:"Other report"};
const typeOf=id=>TYPES.find(t=>t.id===id)||OTHER;

let entries=[];       // {id,typeId,name,nameAr,period,metrics,data,readability,notes,at}
let skipped=new Set();
let currentId=null;   // type being requested
let dashboard=null;   // real result
let busy=false;
let sample=null,db=null,uid=null,downloads=null;

/* ---------- persistence: private per-viewer db, else browser storage ---------- */
const LS="avaya-dash-v1";
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({entries,skipped:[...skipped],dashboard}))}catch(e){}}
function lsLoad(){try{const o=JSON.parse(localStorage.getItem(LS)||"null");if(o){entries=o.entries||[];skipped=new Set(o.skipped||[]);dashboard=o.dashboard||null}}catch(e){}}
const base=()=>"data/users/"+uid;
async function saveEntry(e){lsSave();if(!db||!uid)return;try{await db.doc(base()+"/reports/"+e.id).set({json:JSON.stringify(e).slice(0,240000),at:e.at})}catch(err){}}
async function deleteEntry(id){lsSave();if(!db||!uid)return;try{await db.doc(base()+"/reports/"+id).delete()}catch(err){}}
async function saveState(){lsSave();if(!db||!uid)return;try{await db.doc(base()+"/state/main").set({skipped:[...skipped],dashboard:dashboard?JSON.stringify(dashboard).slice(0,240000):""})}catch(err){}}
async function loadDb(){
  if(!db||!uid)return;
  try{
    const q=await db.collection(base()+"/reports").get();
    const list=q.docs.map(d=>{try{return JSON.parse(d.data().json)}catch(e){return null}}).filter(Boolean).sort((a,b)=>a.at-b.at);
    const st=await db.doc(base()+"/state/main").get();
    if(list.length||st.exists){
      entries=list;
      if(st.exists){const d=st.data();skipped=new Set(d.skipped||[]);try{dashboard=d.dashboard?JSON.parse(d.dashboard):null}catch(e){}}
      lsSave();
    }
  }catch(e){}
}

/* ---------- helpers ---------- */
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}
const doneTypes=()=>new Set(entries.map(e=>e.typeId));
function nextType(){const d=doneTypes();return (TYPES.find(t=>!d.has(t.id)&&!skipped.has(t.id))||null)}
const errCopy=c=>({not_granted:"لم يتم السماح للصفحة باستخدام Claude. فعّل الإذن من قائمة الأذونات ثم أعد المحاولة.",sampling_disabled:"Claude غير متاح لهذا الحساب.",rate_limited:"طلبات كثيرة خلال وقت قصير. انتظر دقيقة ثم أعد المحاولة.",invalid_json:"لم أستطع قراءة الرد بشكل منظم. أعد المحاولة.",refused:"تم رفض الطلب. تأكد أن الملف تقرير Avaya صحيح.",session_expired:"انتهت الجلسة. سجّل الدخول من جديد.",prompt_too_large:"البيانات كبيرة جداً. احذف بعض التقارير المكررة ثم أعد التحليل."}[c]||"حدث خطأ مؤقت في الاتصال. أعد المحاولة.");

/* ---------- collect view ---------- */
let reading=null; // {thumbs,typeId,error,result}
let optIn=null; // after the core reports: continue with optional ones?
function renderReq(){
  const el=$("#req");
  if(reading&&reading.state==="busy"){
    el.innerHTML=`<div class="counter">جاري القراءة</div><div class="reading"><div class="spin"></div><div><strong>Claude يقرأ ملف ${esc(typeOf(reading.asked||"other").en)} ويستخرج الأرقام…</strong><div class="label">عادة 15 إلى 45 ثانية</div></div></div><div class="files">${reading.files.map(f=>`<span>${esc(f.name)} · <b>${f.rows}</b> rows</span>`).join("")}</div>`;
    return;
  }
  const d=doneTypes();
  const core=TYPES.filter(t=>t.req);
  let t=currentId?typeOf(currentId):null;
  // after core: ask once whether to continue with optional reports
  const coreLeft=core.some(c=>!d.has(c.id)&&!skipped.has(c.id));
  const askOpt=t&&!t.req&&!coreLeft&&optIn===null&&!d.has(t.id);
  if(t&&!t.req&&optIn===false&&!d.has(t.id))t=null;
  let got="";
  if(reading&&reading.state==="done"){
    const e=reading.entry;const m=e.metrics||{};
    const mm=[["المكالمات",m.calls_offered,fmtN],["SL",m.service_level_pct,fmtPct],["ASA",m.asa_sec,fmtSec],["AHT",m.aht_sec,fmtSec],["Abandon",m.abandon_rate_pct,fmtPct]].filter(x=>isNum(x[1]));
    got=`<div class="got"><span>✓ استلمت: ${esc(e.nameAr||e.name)}${e.period?" · "+esc(e.period):""}</span>${mm.map(x=>`<span class="chip">${x[0]} <b class="num">${x[2](x[1])}</b></span>`).join("")}<button class="link" id="add-more" data-id="${esc(e.typeId)}">إضافة ملف آخر لنفس التقرير</button></div>
    ${e.readability&&e.readability!=="good"?`<div class="notice">بعض أعمدة الملف غير واضحة. تأكد أن التصدير يحتوي عناوين الأعمدة.</div>`:""}`;
  }else if(reading&&reading.state==="error"){
    got=`<div class="notice err">${esc(reading.error)}</div>`;
  }
  const seq=TYPES.filter(x=>x.req||optIn===true||d.has(x.id));
  const steps=`<div class="steps" aria-hidden="true">${seq.map(x=>`<i class="${d.has(x.id)?"done":t&&x.id===t.id?"cur":skipped.has(x.id)?"skip":""}"></i>`).join("")}</div>`;
  if(askOpt){
    el.innerHTML=`${got}${steps}<div class="counter">خلصنا التقارير الأساسية ✓</div><h2>تبي نكمل التقارير الاختيارية؟</h2><p class="why">باقي ${TYPES.filter(x=>!x.req&&!d.has(x.id)).length} تقارير اختيارية (تفصيل المهارات، الإشغال اليومي، الحضور، الدخول والخروج). تزيد دقة التحليل لكنها مو ضرورية.</p>
    <div class="choice"><button class="btn primary" id="opt-yes">كمّل، اطلبها مني بالدور</button><button class="btn" id="opt-no">لا، ابدأ التحليل الآن</button></div>`;
    $("#opt-yes").onclick=()=>{optIn=true;reading=null;renderCollect()};
    $("#opt-no").onclick=()=>{optIn=false;analyze()};
    bindMore();return;
  }
  if(!t){
    el.innerHTML=`${got}${steps}<div class="counter">اكتمل الجمع ✓</div><h2>كل التقارير جاهزة للتحليل</h2><p class="why">${entries.length} ملف مستلم. اضغط <b>بدء التحليل</b> لبناء الداش بورد، أو ارفع أي تقرير إضافي هنا وClaude يتعرف عليه.</p>
    <button class="btn primary" id="go-analyze" ${!sample||busy?"disabled":""}>بدء التحليل</button>
    ${dropHtml("أرفق تقرير إضافي")}`;
    $("#go-analyze").onclick=analyze;
  }else{

/* read Excel / CSV / CMS text export into compact CSV text */
async function readSheetFile(f){
  const buf=await f.arrayBuffer();
  let wb;
  if(window.XLSX){wb=XLSX.read(buf,{type:"array",cellDates:true,raw:false})}
  else{const txt=new TextDecoder().decode(buf);return {name:f.name,rows:txt.split(/\r?\n/).filter(l=>l.trim()).length,text:"FILE: "+f.name+"\n"+txt}}
  let out="FILE: "+f.name+"\n",rows=0;
  for(const sn of wb.SheetNames.slice(0,6)){
    const csv=XLSX.utils.sheet_to_csv(wb.Sheets[sn],{blankrows:false,strip:true});
    const lines=csv.split("\n").filter(l=>l.replace(/[,\s]/g,"").length);
    if(!lines.length)continue;
    rows+=lines.length;
    out+="SHEET: "+sn+" ("+lines.length+" rows)\n"+lines.slice(0,400).join("\n")+(lines.length>400?"\n...("+(lines.length-400)+" more rows truncated)":"")+"\n";
  }
  return {name:f.name,rows,text:out};
}

const EXTRACT_PROMPT=(asked,data)=>`You are reading an Excel/CSV/text export of a contact-center report from Avaya (usually a custom CrysKSA_* report in CMS Supervisor, Avaya Analytics, Call Center Elite, IP Office or similar). The user expects: "${asked?typeOf(asked).en:"unknown"}"${asked&&typeOf(asked).month?" for the month "+typeOf(asked).month.en:""}, but identify what it really is.
Known report types (type_id: name):
${BASE_TYPES.map(t=>`- ${t.id}: ${t.en}`).join("\n")}
- other: anything else

Rules:
- Read every visible number exactly. Never invent values. If a field is not visible, omit it.
- Convert durations like 0:03:25 or 3:25 to seconds in "metrics". Keep raw text in tables.
- Percentages as plain numbers (82.4 not "82.4%").
- If the report shows totals and per-row data, put totals in "metrics" and rows in "tables".
- The file name and sheet names are strong hints for the report name.
- Each table max 150 rows (keep the Total row). Keep column headers as shown.

Reply with ONLY this JSON:
{"type_id":"one of the ids","report_name":"exact title as on screen","report_name_ar":"Arabic name","period":"date range or date as shown","granularity":"interval|daily|weekly|monthly|other","scope":"skills / agents / VDNs covered",
"metrics":{"calls_offered":n,"calls_answered":n,"calls_abandoned":n,"service_level_pct":n,"service_level_target_sec":n,"asa_sec":n,"aht_sec":n,"avg_talk_sec":n,"avg_acw_sec":n,"avg_hold_sec":n,"max_delay_sec":n,"abandon_rate_pct":n,"avg_abandon_time_sec":n,"occupancy_pct":n,"aux_pct":n,"staffed_hours":n,"agents_count":n,"transfers":n,"fcr_pct":n,"repeat_calls":n,"flow_out":n},
"tables":[{"title":"...","columns":["..."],"rows":[["..."]]}],
"readability":"good|partial|poor","notes_ar":"one Arabic sentence about what this report shows"}

REPORT DATA:
${data}`;

async function handleFiles(files){
  files=files.filter(f=>/\.(xlsx|xls|xlsm|csv|txt|tsv)$/i.test(f.name));
  if(!files.length){toast("أرفق ملف Excel أو CSV");return}
  if(!sample){toast("التحليل يحتاج فتح الصفحة داخل claude.ai");return}
  if(busy)return;
  busy=true;
  const asked=currentId;
  let parsed;
  try{parsed=await Promise.all(files.slice(0,5).map(readSheetFile))}
  catch(e){busy=false;reading={state:"error",error:"تعذّر فتح الملف. احفظه من Excel بصيغة xlsx أو csv ثم أعد الرفع.",asked};renderCollect();return}
  if(!parsed.some(p=>p.rows)){busy=false;reading={state:"error",error:"الملف فارغ أو لا يحتوي بيانات.",asked};renderCollect();return}
  reading={state:"busy",files:parsed,asked};renderCollect();
  try{
    const r=await sample.json(EXTRACT_PROMPT(asked,parsed.map(p=>p.text).join("\n\n").slice(0,180000)),{modelTier:"default"});
    const rb=String(r.type_id||"");const d0=doneTypes();
    const tid=asked&&baseOf(asked)===rb?asked
      :(TYPES.find(t=>t.base===rb&&!d0.has(t.id))||TYPES.find(t=>t.base===rb)||{}).id
      ||(rb==="other"?"other":(asked||"other"));
    const e={id:"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),typeId:tid,name:String(r.report_name||typeOf(tid).en),nameAr:String(r.report_name_ar||typeOf(tid).ar),period:r.period?String(r.period):"",metrics:r.metrics&&typeof r.metrics==="object"?r.metrics:{},data:{granularity:r.granularity,scope:r.scope,tables:Array.isArray(r.tables)?r.tables.slice(0,8):[],files:parsed.map(p=>p.name),notes:r.notes_ar},readability:r.readability||"good",at:Date.now()};
    entries.push(e);skipped.delete(tid);
    await saveEntry(e);
    reading={state:"done",entry:e,asked};
    currentId=(nextType()||{}).id||null;
    toast("تم التعرف: "+e.nameAr);
  }catch(err){
    reading={state:"error",error:errCopy(err&&err.code),asked};
  }finally{busy=false;renderCollect()}
}

const mLabels=D=>(D.months&&Array.isArray(D.months.labels)&&D.months.labels.length===3)?D.months.labels:["قبل شهرين","الشهر الماضي","الشهر الحالي"];

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function animateIn(k,hs){
  const ring=document.querySelector(".ring circle[data-to]");
  if(ring)requestAnimationFrame(()=>requestAnimationFrame(()=>ring.setAttribute("stroke-dashoffset",ring.dataset.to)));
  if(reduce)return;
  const targets=[...document.querySelectorAll(".kpi .v[data-i]")].map(el=>({el,x:k[+el.dataset.i]})).filter(t=>t.x&&isNum(t.x.value));
  const hsEl=$("#hs-num");
  const t0=performance.now(),dur=1100;
  (function step(now){
    const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);
    targets.forEach(t=>{t.el.textContent=kpiVal({...t.x,value:t.x.value*e})});
    if(hsEl&&isNum(hs))hsEl.textContent=Math.round(hs*e);
    if(p<1)requestAnimationFrame(step);
  })(t0);
}

function drawCharts(D,f){
  if(!chartBase())return;
  const col=["--c1","--c2","--c3","--c4","--c5"].map(css);
  const grid={color:css("--line")};
  const common={responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},plugins:{legend:{position:"bottom",rtl:true,labels:{usePointStyle:true,boxWidth:8}},tooltip:{rtl:true}}};
  if(f.hasTrend){
    const series=D.trend.series.slice(0,4);
    const units=[...new Set(series.map(s=>s.unit||""))];
    charts.push(new Chart($("#ch-trend"),{type:"line",data:{labels:D.trend.labels,datasets:series.map((s,i)=>({label:s.name,data:s.values,borderColor:col[i],backgroundColor:col[i]+"22",fill:i===0,tension:.35,pointRadius:2,borderWidth:2,yAxisID:units.length>1&&s.unit!==units[0]?"y1":"y"}))},options:{...common,scales:{x:{grid:{display:false}},y:{grid,beginAtZero:false},...(units.length>1?{y1:{position:"right",grid:{display:false}}}:{})}}}));
  }
  if(f.hasVol){

function drawReportCharts(host,D){

  const t=host.querySelector('[data-ch="trend"]');
  if(t){const series=D.trend.series.slice(0,4);const units=[...new Set(series.map(s=>s.unit||""))];
    out.push(new Chart(t,{type:"line",data:{labels:D.trend.labels,datasets:series.map((s,i)=>({label:s.name,data:s.values,borderColor:RC.c[i],backgroundColor:RC.c[i]+"22",fill:i===0,tension:.35,pointRadius:2,borderWidth:2,yAxisID:units.length>1&&s.unit!==units[0]?"y1":"y"}))},options:{...base,scales:sc(units.length>1?{y1:{position:"right",grid:{display:false},ticks:{color:RC.muted}}}:{})}}))}
  const it=host.querySelector('[data-ch="int"]');
  if(it){const I=D.intervals,ds=[];
    if(Array.isArray(I.offered))ds.push({type:"bar",label:"واردة",data:I.offered,backgroundColor:RC.gray+"88",yAxisID:"y"});
    if(Array.isArray(I.answered))ds.push({type:"bar",label:"مجابة",data:I.answered,backgroundColor:RC.c[0],yAxisID:"y"});
    if(Array.isArray(I.sl))ds.push({type:"line",label:"مستوى الخدمة %",data:I.sl,borderColor:RC.c[1],backgroundColor:RC.c[1],tension:.35,borderWidth:2.5,yAxisID:"y1"});
    out.push(new Chart(it,{data:{labels:I.labels,datasets:ds},options:{...base,scales:sc({y1:{position:"right",min:0,max:100,grid:{display:false},ticks:{color:RC.muted,callback:v=>v+"%"}}})}}))}

  return out;
}
let exporting=false;
async function exportPdf(D){
  if(!downloads||exporting)return;exporting=true;exStatus("جاري تجهيز تقرير PDF… (10 إلى 20 ثانية)");
  let host,rc=[];
  try{
    await Promise.all([loadScript(H2C),loadScript(JSPDF)]);
    try{await document.fonts.ready}catch(e){}
    host=document.createElement("div");host.className="rpt";host.setAttribute("dir","rtl");host.setAttribute("lang","ar");host.innerHTML=reportHtml(D);document.body.appendChild(host);
    rc=drawReportCharts(host,D);
    await new Promise(r=>setTimeout(r,150));
    const pdf=new window.jspdf.jsPDF({unit:"pt",format:"a4",compress:true});
    const W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight();
    let first=true;
    for(const pg of host.querySelectorAll(".pg")){
      const c=await html2canvas(pg,{scale:2,backgroundColor:"#ffffff",logging:false,windowWidth:900});
      const per=Math.floor(c.width*H/W);
      for(let y=0;y<c.height;y+=per){
        const h=Math.min(per,c.height-y);if(h<60&&!first)break;
        const sl=document.createElement("canvas");sl.width=c.width;sl.height=h;sl.getContext("2d").drawImage(c,0,y,c.width,h,0,0,c.width,h);
        if(!first)pdf.addPage();first=false;
        pdf.addImage(sl.toDataURL("image/jpeg",0.93),"JPEG",0,0,W,h*W/c.width);
      }
    }
    pdf.setProperties({title:"Contact Center Performance Report",subject:"Avaya CMS MPR",creator:"Avaya Reports Center"});
    await saveFile("Avaya_Performance_Report_"+safeName(D.title_period)+".pdf",pdf.output("blob"));
  }catch(e){exStatus("تعذّر إنشاء PDF. تأكد من الاتصال بالإنترنت ثم أعد المحاولة.",true)}
  finally{rc.forEach(c=>c.destroy());if(host)host.remove();exporting=false}
}

  add("Source_Metrics",raw,[40,22,22,22,12]);
  let ti=0;
  entries.forEach(e=>((e.data&&e.data.tables)||[]).forEach(t=>{if(ti>=20||!Array.isArray(t.columns)||!Array.isArray(t.rows))return;ti++;add("Src"+ti+"_"+safeName(e.name).replace(/^CrysKSA_/,"").slice(0,22),[t.columns,...t.rows],t.columns.map(()=>14))}));
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  saveFile("Avaya_PowerBI_"+safeName(P)+".xlsx",new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
}

/* ---------- tabs ---------- */
function showTab(name){
  const c=name==="collect";
  $("#view-collect").hidden=!c;$("#view-dash").hidden=c;
  $("#tab-collect").setAttribute("aria-selected",String(c));$("#tab-dash").setAttribute("aria-selected",String(!c));
  if(!c&&!busy)renderDash();
  try{localStorage.setItem(LS+"-tab",name)}catch(e){}
  window.scrollTo(0,0);
}
$("#tab-collect").onclick=()=>showTab("collect");
$("#tab-dash").onclick=()=>showTab("dash");

/* re-theme charts when the viewer theme changes */
const rerender=()=>{if(!$("#view-dash").hidden&&!busy)renderDash()};
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",rerender)}catch(e){}
new MutationObserver(rerender).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

/* ---------- animated network background ---------- */
(function(){
  const cv=$("#bg");if(!cv||!cv.getContext)return;
  const ctx=cv.getContext("2d");let W,H,dpr,nodes=[];
  function size(){dpr=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(Math.min(70,W*H/22000));nodes=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25}))}
  function frame(){
    ctx.clearRect(0,0,W,H);
    for(const a of nodes){a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>W)a.vx*=-1;if(a.y<0||a.y>H)a.vy*=-1}
    for(let i=0;i<nodes.length;i++){const a=nodes[i];
      for(let j=i+1;j<nodes.length;j++){const b=nodes[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;
        if(d<17000){ctx.strokeStyle="rgba(34,211,238,"+(0.14*(1-d/17000))+")";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
      ctx.fillStyle="rgba(34,211,238,.55)";ctx.beginPath();ctx.arc(a.x,a.y,1.4,0,6.283);ctx.fill()}
    if(!reduce&&!document.hidden)requestAnimationFrame(frame);
  }
  size();frame();
  addEventListener("resize",()=>{size();if(reduce)frame()});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!reduce)requestAnimationFrame(frame)});
})();

/* ---------- boot ---------- */
const migrate=()=>entries.forEach(e=>{if(!TYPES.some(t=>t.id===e.typeId)&&TYPES.some(t=>t.base===e.typeId))e.typeId=e.typeId+"@m0"});
lsLoad();migrate();
currentId=(nextType()||{}).id||null;
renderCollect();renderDash();
try{if(localStorage.getItem(LS+"-tab")==="dash")showTab("dash")}catch(e){}

(async()=>{
  if(!window.claude||!claude.use)return;
  const [s,d,u,dl]=await Promise.all([claude.use("sample"),claude.use("db"),claude.use("user"),claude.use("downloads")]);
  sample=s;db=d;downloads=dl;
  if(sample){const lv=$("#live");lv.classList.remove("off");lv.lastChild.textContent="AI ONLINE"}
  if(u&&db){try{uid=await u.id()}catch(e){uid=null}}
  await loadDb();migrate();
  currentId=(nextType()||{}).id||null;
  renderCollect();
  if(!$("#view-dash").hidden&&!busy)renderDash();
})();
})();
</script>

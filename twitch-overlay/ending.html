<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Stream Ending</title>
<link rel="stylesheet" href="style.css">
<style>
.thanks{display:flex;gap:40px;margin-top:50px}
.card{padding:28px 44px;min-width:380px}
.card h3{font-size:26px;color:var(--muted);font-weight:700}
.card p{font-size:40px;font-weight:900;margin-top:6px}
.card.gold{border-color:var(--gold);box-shadow:0 0 30px color-mix(in srgb,var(--gold) 40%,transparent)}
.card.gold p{color:var(--gold)}
</style></head>
<body class="scene">
<div class="bg"><div class="grid"></div><div class="particles"></div></div>
<div class="center" style="justify-content:flex-start;padding-top:150px">
  <div class="brand neon" style="font-size:110px">GG</div>
  <div class="title">شكراً لكم على المتابعة 💜</div>
  <div class="subtitle">نشوفكم في البث الجاي — <span data-cfg="displayName"></span></div>
  <div class="thanks">
    <div class="card glass"><h3>آخر متابع</h3><p id="lf">—</p></div>
    <div class="card glass gold"><h3>أكبر داعم اليوم</h3><p id="td">—</p></div>
    <div class="card glass"><h3>آخر مشترك</h3><p id="ls">—</p></div>
  </div>
</div>
<div class="socials"></div>
<script src="config.js"></script><script src="core.js"></script>
<script>
const st=OVL.store;
document.getElementById('lf').textContent=st.get('lastFollow','—');
document.getElementById('ls').textContent=st.get('lastSub','—');
const t=st.get('topDonor',null);
document.getElementById('td').textContent=t?`${t.name} (${OVL.C.goal.currency}${t.amount})`:'—';
</script></body></html>

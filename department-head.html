<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة رئيسة القسم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700&display=swap">
<script>
(function(){try{var t=localStorage.getItem('dh-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
:root{
  --bg:#F4F2EE; --surface:#FFFFFF; --surface-2:#F0EDE7; --border:#E2DDD4;
  --ink:#1F2430; --muted:#6A6F7A; --faint:#9A9EA6;
  --accent:#5B2C6F; --accent-2:#7D4A93; --accent-soft:#EFE6F3; --accent-ink:#FFFFFF;
  --ok:#1F7A55; --ok-soft:#E3F3EB; --warn:#A8670B; --warn-soft:#FBF0DD;
  --bad:#B4322E; --bad-soft:#FBE6E4; --info:#24609E; --info-soft:#E3EEF9;
  --shadow:0 1px 2px rgba(30,25,40,.05),0 4px 16px rgba(30,25,40,.05);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15131A; --surface:#1E1B24; --surface-2:#272330; --border:#36313F;
    --ink:#ECE8F0; --muted:#A49FAE; --faint:#77727F;
    --accent:#C79BE0; --accent-2:#B282CC; --accent-soft:#33283D; --accent-ink:#1A1420;
    --ok:#5CC89A; --ok-soft:#1D3229; --warn:#E5AC4C; --warn-soft:#3A2E1A;
    --bad:#F07C76; --bad-soft:#3C2222; --info:#7FB2EA; --info-soft:#1E2C3D;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#15131A; --surface:#1E1B24; --surface-2:#272330; --border:#36313F;
  --ink:#ECE8F0; --muted:#A49FAE; --faint:#77727F;
  --accent:#C79BE0; --accent-2:#B282CC; --accent-soft:#33283D; --accent-ink:#1A1420;
  --ok:#5CC89A; --ok-soft:#1D3229; --warn:#E5AC4C; --warn-soft:#3A2E1A;
  --bad:#F07C76; --bad-soft:#3C2222; --info:#7FB2EA; --info-soft:#1E2C3D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.6}
h1,h2,h3,h4{font-family:"Noto Kufi Arabic","IBM Plex Sans Arabic",sans-serif;margin:0;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--surface);border-inline-end:1px solid var(--border);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;border-bottom:1px solid var(--border);margin-bottom:8px}
.brand .logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-family:"Noto Kufi Arabic"}
.brand b{display:block;font-size:15px}
.brand small{color:var(--muted);font-size:12px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav svg{width:19px;height:19px;flex:none}
.nav .count{margin-inline-start:auto;background:var(--bad);color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.side .foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:5}
.top .title{flex:1;min-width:0}
.top .title h1{font-size:19px}
.top .title small{color:var(--muted);font-size:12.5px}
.menu-btn{display:none}
.content{padding:24px 28px 60px;max-width:1400px;width:100%}
/* ui */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);padding:7px 14px;border-radius:10px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.btn.icon{padding:7px;width:36px;height:36px;justify-content:center}
.btn svg{width:16px;height:16px}
select,input[type=text],input[type=date],input[type=number],input[type=email],input[type=time],textarea{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:7px 10px;width:100%}
textarea{min-height:90px;resize:vertical}
select:focus,input:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h3{font-size:15.5px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .grow{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);cursor:default}
.kpi[data-go]{cursor:pointer}
.kpi[data-go]:hover{border-color:var(--accent)}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font-size:28px;font-weight:700;font-family:"Noto Kufi Arabic";line-height:1.3;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--faint)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.toolbar .grow{flex:1}
.toolbar select,.toolbar input{width:auto;min-width:150px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.info{background:var(--info-soft);color:var(--info)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--border);vertical-align:middle}
th{background:var(--surface-2);color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 50%,transparent)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);text-align:center;padding:24px;font-size:14px}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.avatar.lg{width:56px;height:56px;font-size:19px}
.bar{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.bar.ok>i{background:var(--ok)}.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:6px 14px;border-radius:9px;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
/* alerts */
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:14px;cursor:pointer;border-inline-start:4px solid var(--faint)}
.alert:hover{filter:brightness(.98)}
.alert.bad{background:var(--bad-soft);border-color:var(--bad)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn)}
.alert.info{background:var(--info-soft);border-color:var(--info)}
/* timeline */
.tl{display:flex;flex-direction:column;gap:8px}
.tl-item{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:12px}
.tl-item.now{border-color:var(--accent);background:var(--accent-soft)}
.tl-item .time{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;color:var(--muted);line-height:1.3}
.tl-item .time b{display:block;color:var(--ink);font-size:15px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--accent)}
.live{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
/* schedule grid */
.sched{display:grid;grid-template-columns:110px repeat(5,minmax(150px,1fr));gap:6px;min-width:880px}
.sched .hd{background:var(--surface-2);border-radius:10px;padding:8px;text-align:center;font-weight:600;font-size:13.5px}
.sched .hd.today{background:var(--accent);color:var(--accent-ink)}
.sched .pd{display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;font-variant-numeric:tabular-nums}
.sched .cell{min-height:92px;border:1px dashed var(--border);border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:4px}
.slot{border-radius:9px;padding:6px 8px;font-size:12.5px;line-height:1.45;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-inline-start:4px solid var(--c,var(--accent))}
.slot:hover{box-shadow:var(--shadow)}
.slot b{display:block;font-size:13px}
.slot.clash{border-color:var(--bad);background:var(--bad-soft)}
.add-cell{all:unset;cursor:pointer;color:var(--faint);font-size:12px;text-align:center;padding:2px;border-radius:6px;margin-top:auto}
.add-cell:hover{color:var(--accent);background:var(--accent-soft)}
/* doctors */
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.doc .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.doc .stats div{background:var(--surface-2);border-radius:10px;padding:8px;text-align:center}
.doc .stats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.doc .stats span{font-size:12px;color:var(--muted)}
/* messages */
.msg-layout{display:grid;grid-template-columns:360px 1fr;gap:16px;min-height:560px}
.msg-list{display:flex;flex-direction:column;overflow:auto;max-height:72vh;padding:0}
.msg-item{all:unset;box-sizing:border-box;display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.msg-item:hover{background:var(--surface-2)}
.msg-item.on{background:var(--accent-soft)}
.msg-item.unread .subj{font-weight:700}
.msg-item .subj{font-size:14px}
.msg-item .prev{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}
.bubble{padding:12px 14px;border-radius:14px;background:var(--surface-2);max-width:85%}
.bubble.me{background:var(--accent-soft);align-self:flex-end}
.bubble .meta{font-size:12px;color:var(--muted);margin-bottom:4px}
.thread{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto;padding:4px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,10,20,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--border)}
.modal.wide{max-width:920px}
.modal header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal header h3{flex:1;font-size:17px}
.modal .body{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border);flex-wrap:wrap}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:500}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields .full{grid-column:1/-1}
.q-row{display:grid;grid-template-columns:28px 1fr 150px 80px 36px;gap:8px;align-items:start}
.q-row .n{padding-top:8px;color:var(--muted);font-weight:600;text-align:center}
.check-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;max-height:340px;overflow:auto}
.check-list label{display:flex;gap:8px;align-items:center;padding:6px 10px;border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:14px}
.check-list label.abs{background:var(--bad-soft);border-color:var(--bad)}
.note{padding:10px 12px;border-radius:10px;background:var(--warn-soft);font-size:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:60;transition:transform .25s;font-size:14px}
.toast.show{transform:translateX(-50%) translateY(0)}
.pop{position:absolute;top:56px;left:20px;width:360px;max-width:calc(100vw - 32px);z-index:20;display:none}
.pop.show{display:block}
.role-pill{display:flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:12px;padding:3px 3px 3px 10px}
.role-pill select{border:0;background:transparent;width:auto;padding:5px;font-weight:600}
.cal-day{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.cal-day:last-child{border-bottom:0}
.cal-date{width:58px;flex:none;text-align:center;background:var(--surface-2);border-radius:10px;padding:6px 0;line-height:1.2}
.cal-date b{display:block;font-size:20px}
.cal-date small{font-size:11px;color:var(--muted)}
.section-title{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.section-title h2{font-size:17px}
.overlay{display:none}
@media (max-width:1100px){.g-main,.g3{grid-template-columns:1fr}.msg-layout{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:270px;z-index:40;transform:translateX(100%);transition:transform .25s}
  .side.open{transform:none}
  .overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39}
  .menu-btn{display:inline-flex}
  .top{padding:12px 16px;flex-wrap:wrap}
  .content{padding:16px 16px 60px}
  .g2,.fields{grid-template-columns:1fr}
  .q-row{grid-template-columns:24px 1fr 36px}
  .q-row select,.q-row input[type=number]{grid-column:2}
  .top .hide-sm{display:none}
}
@media print{
  .side,.top,.toolbar,.btn,.no-print{display:none!important}
  .app{display:block}.content{padding:0}
  .card,.kpi{box-shadow:none;break-inside:avoid}
  body{background:#fff;color:#000}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo">ق</div>
      <div><b id="deptName">قسم علوم الحاسب</b><small>كلية الحاسب والمعلومات</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div class="row" style="justify-content:space-between">
        <span>الفصل الأول ١٤٤٨هـ</span>
        <button class="btn sm" onclick="resetDemo()" title="إعادة البيانات التجريبية">إعادة ضبط</button>
      </div>
    </div>
  </aside>
  <div class="overlay" id="overlay" onclick="toggleSide(false)"></div>
  <div class="main">
    <header class="top">
      <button class="btn icon menu-btn" onclick="toggleSide(true)" aria-label="القائمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="title"><h1 id="pageTitle">لوحة التحكم</h1><small id="today"></small></div>
      <div class="role-pill hide-sm" title="تبديل العرض لتجربة واجهة الدكتورة">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        <select id="roleSel" onchange="setRole(this.value)" aria-label="عرض كـ"></select>
      </div>
      <button class="btn icon" onclick="toggleTheme()" aria-label="تبديل المظهر" title="فاتح / داكن"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <button class="btn icon" onclick="togglePop()" aria-label="التنبيهات" style="position:relative"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg><span id="bellCount" class="count" style="position:absolute;top:-6px;left:-6px;background:var(--bad);color:#fff;font-size:11px;border-radius:9px;min-width:18px;height:18px;display:none;place-items:center;padding:0 4px"></span></button>
      <div class="card pop" id="pop"></div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,9);
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
const PERIODS=[['08:00','09:40'],['10:00','11:40'],['12:00','13:40'],['14:00','15:40']];
const ROOMS=['ق-101','ق-102','ق-103','ق-201','معمل 1','معمل 2'];
const COLORS=['#7D4A93','#24609E','#1F7A55','#B4532E','#A8670B','#2E7C86','#9B3C6B','#4F5BA8'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const TODAY_ISO=iso(TODAY);
const fmtD=new Intl.DateTimeFormat('ar-u-nu-latn',{weekday:'long',day:'numeric',month:'long'});
const fmtWd=new Intl.DateTimeFormat('ar',{weekday:'long'});
const fmtShort=new Intl.DateTimeFormat('ar-u-nu-latn',{day:'numeric',month:'short'});
const fmtHijri=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'});
const fd=s=>fmtD.format(parseISO(s));
const fs=s=>fmtShort.format(parseISO(s));
const daysTo=s=>Math.round((parseISO(s)-TODAY)/864e5);
const pct=(a,b)=>b?Math.round(a/b*100):0;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ================= analytics ================= */
function conflicts(){
  const out=[];const sl=DB.slots;
  for(let i=0;i<sl.length;i++)for(let j=i+1;j<sl.length;j++){
    const a=sl[i],b=sl[j];if(a.day!==b.day||a.period!==b.period)continue;
    const ca=C(a.courseId),cb=C(b.courseId);
    if(a.room===b.room)out.push({a,b,type:'قاعة',text:`تعارض قاعة ${a.room}: ${ca.code} و ${cb.code} — ${DAYS[a.day]} ${PERIODS[a.period][0]}`});
    if(ca.doctorId===cb.doctorId)out.push({a,b,type:'دكتورة',text:`${D(ca.doctorId).name} لديها محاضرتان في نفس الوقت — ${DAYS[a.day]} ${PERIODS[a.period][0]}`});
    if(ca.level===cb.level&&ca.id!==cb.id)out.push({a,b,type:'مستوى',text:`تعارض لطالبات المستوى ${ca.level}: ${ca.code} و ${cb.code} — ${DAYS[a.day]} ${PERIODS[a.period][0]}`});
  }
  return out;
}
const clashIds=()=>{const s=new Set();conflicts().forEach(c=>{s.add(c.a.id);s.add(c.b.id)});return s};
function courseAtt(c){
  const ses=DB.sessions.filter(s=>s.courseId===c.id&&s.att);
  const total=ses.length;
  const rows=c.students.map(st=>{const a=ses.filter(s=>s.att.absent.includes(st.id)).length;const p=pct(a,total);return{...st,abs:a,p,state:p>=25?'bad':p>=15?'warn':'ok'}});
  const absTotal=rows.reduce((t,r)=>t+r.abs,0);
  const rate=total&&c.students.length?100-Math.round(absTotal/(total*c.students.length)*100):0;
  return {total,rows,rate,risk:rows.filter(r=>r.state==='bad').length,warn:rows.filter(r=>r.state==='warn').length};
}
function docStats(id){
  const cs=DB.courses.filter(c=>c.doctorId===id);const cids=cs.map(c=>c.id);
  const slots=DB.slots.filter(s=>cids.includes(s.courseId));
  const past=DB.sessions.filter(s=>cids.includes(s.courseId)&&s.date<TODAY_ISO&&s.status!=='scheduled');
  const held=past.filter(s=>s.status==='held'||s.status==='online');
  const sub=held.filter(s=>s.att).length;
  const ex=DB.exams.filter(e=>e.doctorId===id);
  const rates=cs.map(c=>courseAtt(c).rate).filter(Boolean);
  return {courses:cs,slots,hours:slots.length*2,total:past.length,held:held.length,heldP:pct(held.length,past.length),subP:pct(sub,held.length),missing:held.length-sub,absent:past.filter(s=>s.status==='absent').length,postponed:past.filter(s=>s.status==='postponed').length,exams:ex,stuRate:rates.length?Math.round(rates.reduce((a,b)=>a+b,0)/rates.length):0};
}

  examClashes().filter(x=>isHead()||x.some(e=>e.doctorId===me())).forEach(x=>A.push({lv:'warn',t:`تعارض اختبارات للمستوى ${C(x[0].courseId).level} يوم ${fs(x[0].date)}: ${x.map(e=>C(e.courseId).code).join(' و ')}`,go:'exams'}));
  const risk=myCourses().reduce((t,c)=>t+courseAtt(c).risk,0);if(risk)A.push({lv:'warn',t:`${risk} طالبة تجاوزن نسبة الغياب المسموحة (25%)`,go:'attendance'});

}

function slotForm(){return{courseId:val('s_course'),day:+val('s_day'),period:+val('s_period'),room:val('s_room'),kind:val('s_kind')}}
function slotIssues(id,o){const c=C(o.courseId);const doc=val('s_doc')||c.doctorId;return DB.slots.filter(s=>s.id!==id&&s.day===o.day&&s.period===o.period).flatMap(s=>{const x=C(s.courseId),r=[];if(s.room===o.room)r.push(`القاعة ${o.room} مشغولة بـ ${x.code}`);if(x.doctorId===doc)r.push(`الدكتورة لديها ${x.code} في نفس الوقت`);if(x.level===c.level&&x.id!==c.id)r.push(`طالبات المستوى ${c.level} لديهن ${x.code}`);return r})}

function saveSlot(id){const o=slotForm();const is=slotIssues(id,o);if(is.length&&!confirm('يوجد تعارض:\n'+is.join('\n')+'\nهل تريدين الحفظ رغم ذلك؟'))return;
  const c=C(o.courseId);const nd=val('s_doc');if(nd&&nd!==c.doctorId){c.doctorId=nd;DB.exams.filter(e=>e.courseId===c.id).forEach(e=>e.doctorId=nd);log(`إسناد ${c.code} إلى ${D(nd).name}`)}
  if(id)Object.assign(DB.slots.find(s=>s.id===id),o);else DB.slots.push({id:uid('l'),...o});
  log(`${id?'تعديل':'إضافة'} موعد ${c.code} — ${DAYS[o.day]} ${PERIODS[o.period][0]}`);closeModal();render();toast('تم تحديث الجدول')}
function delSlot(id){if(!confirm('حذف هذه المحاضرة من الجدول؟'))return;DB.slots=DB.slots.filter(s=>s.id!==id);closeModal();render();toast('تم الحذف')}

function saveExam(id,st){
  const o={courseId:val('ex_c'),type:val('ex_t'),date:val('ex_d'),time:val('ex_tm'),duration:+val('ex_du'),room:val('ex_r'),questions:QS.filter(q=>q.text.trim())};
  if(!o.date)return toast('حددي تاريخ الاختبار');

  const note=val('ex_note');
  if(st==='revision'&&!note)return toast('اكتبي ملاحظات التعديل المطلوبة');
  if(st==='submitted'&&daysTo(o.date)<7&&!confirm('موعد الاختبار بعد أقل من 7 أيام (المهلة المعتمدة). متابعة الإرسال؟'))return;
  let e;
  if(id){e=DB.exams.find(x=>x.id===id);const changed=JSON.stringify(e.questions)!==JSON.stringify(o.questions)||e.date!==o.date;Object.assign(e,o);e.doctorId=C(o.courseId).doctorId;if(changed)e.history.push({date:TODAY_ISO,by:me(),text:isHead()?'تعديل من رئيسة القسم':'تحديث الاختبار'})}

  if(note&&!st)e.notes.push({by:me(),date:TODAY_ISO,text:note});
  if(st){setExam(e.id,st,note);return}

}

VIEWS.messages=()=>{

  return `
  <div class="toolbar"><div class="tabs">${[['all','الكل'],['unread','غير مقروءة'],['requests','طلبات'],['open','مفتوحة'],['closed','مغلقة']].map(([k,l])=>`<button class="${ui.msgFilter===k?'on':''}" onclick="ui.msgFilter='${k}';render()">${l}</button>`).join('')}</div><span class="grow"></span><button class="btn primary" onclick="composeMsg()">${ic('plus')} رسالة جديدة</button></div>

}
function reply(id){const t=val('reply');if(!t)return;const m=DB.messages.find(x=>x.id===id);const now=new Date().toISOString();m.thread.push({from:me(),date:now,text:t});m.date=now;if(isHead()){m.readDoc=false;if(m.status==='open')m.status='progress'}else{m.readHead=false}render();toast('تم إرسال الرد')}
function decide(id,dec){const m=DB.messages.find(x=>x.id===id);m.decision=dec;m.status='closed';m.readDoc=false;const now=new Date().toISOString();m.thread.push({from:'head',date:now,text:dec==='approved'?'تمت الموافقة على طلبك.':'نعتذر، لم تتم الموافقة على الطلب. يمكن مناقشته في مكتب رئيسة القسم.'});log(`${dec==='approved'?'موافقة على':'رفض'} طلب ${m.cat} — ${D(m.doctorId).name}`);render();toast('تم تسجيل القرار وإشعار الدكتورة')}
function composeMsg(to,cat,subj){
  openModal('رسالة جديدة',`<div class="fields">
   ${isHead()?`<div class="field full"><label>إلى</label><select id="cm_to"><option value="all">جميع الدكتورات</option>${DB.doctors.map(d=>`<option value="${d.id}" ${d.id===to?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div>`:'<div class="field full"><label>إلى</label><input type="text" value="رئيسة القسم — '+esc(DB.head)+'" disabled></div>'}
   <div class="field"><label>التصنيف</label><select id="cm_cat">${(isHead()?['متابعة','تكليف','استفسار','اجتماع']:['استفسار','إجازة','تعديل جدول','اختبارات','اقتراح','شكوى']).map(c=>`<option ${c===cat?'selected':''}>${c}</option>`).join('')}</select></div>
   <div class="field"><label>الأولوية</label><select id="cm_pr"><option>منخفضة</option><option selected>متوسطة</option><option>عالية</option></select></div>
   <div class="field full"><label>الموضوع</label><input type="text" id="cm_s" value="${esc(subj||'')}"></div>
   <div class="field full"><label>نص الرسالة</label><textarea id="cm_b" style="min-height:130px"></textarea></div></div>`,
   `<button class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary" onclick="sendMsg()">إرسال</button>`);
}
function sendMsg(){const s=val('cm_s'),b=val('cm_b');if(!s||!b)return toast('أكملي الموضوع ونص الرسالة');const now=new Date().toISOString();
  const tos=isHead()?(val('cm_to')==='all'?DB.doctors.map(d=>d.id):[val('cm_to')]):[me()];
  let last;tos.forEach(t=>{last={id:uid('m'),doctorId:t,fromHead:isHead(),cat:val('cm_cat'),priority:val('cm_pr'),subject:s,status:'open',readHead:isHead(),readDoc:!isHead(),decision:null,date:now,thread:[{from:me(),date:now,text:b}]};DB.messages.unshift(last)});
  log('رسالة: '+s);closeModal();ui.msgSel=last.id;ui.msgFilter='all';if(view!=='messages')go('messages');else render();toast('تم الإرسال')}

/* ---------- announcements ---------- */
VIEWS.announcements=()=>{
  const list=DB.announcements.slice().sort((a,b)=>(b.pinned-a.pinned)||b.date.localeCompare(a.date));
  return `<div class="toolbar"><span class="grow muted small">${isHead()?'تابعي من اطّلعت على كل تعميم من الدكتورات':'يرجى تأكيد الاطلاع على التعاميم'}</span>${isHead()?`<button class="btn primary" onclick="annModal()">${ic('plus')} تعميم جديد</button>`:''}</div>
  <div class="stack">${list.map(a=>{const pend=DB.doctors.filter(d=>!a.acks.includes(d.id));return `<div class="card" ${a.pinned?'style="border-color:var(--accent)"':''}>
   <h3>${a.pinned?'📌 ':''}<span class="grow">${esc(a.title)}</span><span class="small faint">${fd(a.date)}</span></h3>
   <p style="margin:0 0 12px">${esc(a.body).replace(/\n/g,'<br>')}</p>
   ${isHead()?`<div class="row wrap small"><span class="badge ok">اطّلعت ${a.acks.length} من ${DB.doctors.length}</span>${pend.length?`<span class="muted">لم تطّلع بعد: ${pend.map(d=>esc(d.name)).join('، ')}</span>`:'<span class="muted">اطّلعت جميع الدكتورات ✓</span>'}<span class="grow" style="flex:1"></span><button class="btn sm" onclick="pinAnn('${a.id}')">${a.pinned?'إلغاء التثبيت':'تثبيت'}</button><button class="btn sm bad" onclick="delAnn('${a.id}')">${ic('trash')}</button></div>`
   :(a.acks.includes(me())?'<span class="badge ok">✓ تم الاطلاع</span>':`<button class="btn sm primary" onclick="ackAnn('${a.id}')">تأكيد الاطلاع</button>`)}</div>`}).join('')||'<div class="empty">لا توجد تعاميم</div>'}</div>`;
};
function annModal(){openModal('تعميم جديد',`<div class="field"><label>العنوان</label><input type="text" id="an_t"></div><div class="field"><label>النص</label><textarea id="an_b" style="min-height:140px"></textarea></div><label class="row small"><input type="checkbox" id="an_p"> تثبيت أعلى القائمة</label>`,`<button class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary" onclick="saveAnn()">نشر التعميم</button>`)}
function saveAnn(){const t=val('an_t'),b=val('an_b');if(!t||!b)return toast('أكملي العنوان والنص');DB.announcements.push({id:uid('a'),title:t,body:b,date:TODAY_ISO,pinned:$('#an_p').checked,acks:[]});log('نشر تعميم: '+t);closeModal();go('announcements');toast('تم نشر التعميم لجميع الدكتورات')}
function ackAnn(id){DB.announcements.find(a=>a.id===id).acks.push(me());render();toast('شكراً، تم تسجيل اطلاعك')}
function pinAnn(id){const a=DB.announcements.find(a=>a.id===id);a.pinned=!a.pinned;render()}
function delAnn(id){if(!confirm('حذف التعميم؟'))return;DB.announcements=DB.announcements.filter(a=>a.id!==id);render()}

/* ---------- reports ---------- */
VIEWS.reports=()=>{
  const rows=DB.doctors.map(d=>({d,s:docStats(d.id)}));
  const score=s=>Math.round(s.heldP*.4+s.subP*.3+s.stuRate*.2+(s.exams.length?pct(s.exams.filter(e=>e.status==='approved'||e.status==='submitted').length,s.exams.length):100)*.1);
  return `
  <div class="toolbar"><span class="grow muted small">الفترة: آخر 4 أسابيع حتى ${fd(TODAY_ISO)}</span><button class="btn" onclick="exportReport()">${ic('dl')} تصدير Excel (CSV)</button><button class="btn primary" onclick="window.print()">${ic('print')} طباعة التقرير</button></div>
  <div class="card" style="margin-bottom:16px"><h3>${ic('rep')} مؤشر الأداء المركّب للدكتورات</h3><div class="small muted" style="margin-bottom:12px">40% انعقاد المحاضرات · 30% رفع التحضير · 20% حضور الطالبات · 10% جاهزية الاختبارات</div>
  <div class="stack">${rows.map(r=>({...r,sc:score(r.s)})).sort((a,b)=>b.sc-a.sc).map((r,i)=>`<div class="row"><span class="num faint" style="width:18px">${i+1}</span>${av(r.d)}<span style="width:170px" class="small"><b>${esc(r.d.name)}</b></span><div class="bar ${r.sc>=90?'ok':r.sc>=80?'warn':'bad'}" style="flex:1;height:12px"><i style="width:${r.sc}%"></i></div><b class="num" style="width:44px;text-align:end">${r.sc}</b></div>`).join('')}</div></div>
  <div class="tbl-wrap"><table><thead><tr><th>الدكتورة</th><th>المقررات</th><th>ساعات/أسبوع</th><th>محاضرات</th><th>انعقاد</th><th>غياب</th><th>تأجيل</th><th>رفع التحضير</th><th>حضور الطالبات</th><th>الاختبارات المعتمدة</th></tr></thead><tbody>
  ${rows.map(({d,s})=>`<tr><td><b>${esc(d.name)}</b><div class="small muted">${esc(d.rank)}</div></td><td class="num">${s.courses.length}</td><td class="num">${s.hours}</td><td class="num">${s.total}</td><td class="num"><span class="badge ${s.heldP>=90?'ok':s.heldP>=80?'warn':'bad'}">${s.heldP}%</span></td><td class="num">${s.absent}</td><td class="num">${s.postponed}</td><td class="num"><span class="badge ${s.subP>=90?'ok':s.subP>=75?'warn':'bad'}">${s.subP}%</span></td><td class="num">${s.stuRate}%</td><td class="num">${s.exams.filter(e=>e.status==='approved').length}/${s.exams.length}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="section-title"><h2>ملخص المقررات</h2></div>
  <div class="tbl-wrap"><table><thead><tr><th>المقرر</th><th>المستوى</th><th>الدكتورة</th><th>الطالبات</th><th>نسبة الحضور</th><th>إنذار</th><th>حرمان</th></tr></thead><tbody>
  ${DB.courses.map(c=>{const a=courseAtt(c);return `<tr><td><b>${esc(c.code)}</b> ${esc(c.name)}</td><td>${c.level}</td><td class="small">${esc(D(c.doctorId).name)}</td><td class="num">${c.students.length}</td><td><div class="row"><div class="bar ${a.rate>=90?'ok':a.rate>=80?'warn':'bad'}" style="flex:1"><i style="width:${a.rate}%"></i></div><span class="num small">${a.rate}%</span></div></td><td class="num">${a.warn}</td><td class="num">${a.risk?`<span class="badge bad">${a.risk}</span>`:0}</td></tr>`}).join('')}
  </tbody></table></div>`;
};
function exportReport(){csv('تقرير_أداء_القسم.csv',[['الدكتورة','الرتبة','المقررات','ساعات/أسبوع','المحاضرات','نسبة الانعقاد','غياب','تأجيل','رفع التحضير','حضور الطالبات','الاختبارات المعتمدة']].concat(DB.doctors.map(d=>{const s=docStats(d.id);return[d.name,d.rank,s.courses.length,s.hours,s.total,s.heldP+'%',s.absent,s.postponed,s.subP+'%',s.stuRate+'%',s.exams.filter(e=>e.status==='approved').length+'/'+s.exams.length]})))}

render();
setInterval(()=>{if(view==='overview'&&!$('#modalBg').classList.contains('show'))render()},60000);
</script>
</body>
</html>
